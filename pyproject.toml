[project]
name = "bug-bounty-cli"
version = "0.3.0"
description = "Multi-source bug bounty and audit competition discovery, scope and read-only EVM inspection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bb = "bb_cli.cli:main"
bug-bounty = "bb_cli.cli:main"
immunefi = "bb_cli.providers.immunefi.cli:main"
cantina = "bb_cli.providers.cantina.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bb_cli", "src/immunefi_cli", "src/cantina_cli"]
