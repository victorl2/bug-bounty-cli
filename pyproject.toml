[project]
name = "immunefi-cli"
version = "0.1.0"
description = "Browse Immunefi bug-bounty programs and audit competitions from the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
immunefi = "immunefi_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immunefi_cli"]
